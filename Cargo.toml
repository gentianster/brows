[package]
name = "brows"
version = "1.0.15"
edition = "2021"

[[bin]]
name = "brows"
path = "src/main.rs"

[dependencies]
egui = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8.23"
anyhow = "1"
dirs-next = "2"
raw-window-handle = "0.6"
fs2 = "0.4"
tempfile = "3"
url = "2"

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.27", default-features = false, features = ["default_fonts", "glow", "x11"] }
gio = "0.20"
image = { version = "0.24", default-features = false, features = ["png"] }
libc = "0.2"
x11rb = "0.13"
winit = { version = "0.29", default-features = false, features = ["x11", "rwh_06"] }

[target.'cfg(windows)'.dependencies]
eframe = "0.27"
winreg = "0.52"
windows = { version = "0.56", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Security_Authorization",
] }

# Windowsでコンソールウィンドウを非表示にする（UI起動時）
# 登録コマンド時はコンソールが必要なので、サブコマンドで切り替える
[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
opt-level = "s"  # サイズ優先
strip = true
